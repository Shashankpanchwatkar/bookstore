<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bookstore OTP Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" 
          rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa; 
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .login-container {
            width: 100%;
            max-width: 400px;
            padding: 2rem;
            box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.15);
            border-radius: 0.5rem;
            background-color: #ffffff;
        }
    </style>
</head>
<body>

<div class="login-container">
    <h3 class="mb-4 text-center text-primary">Login with OTP 🔒</h3>
    
    <div id="phoneInputDiv" class="mb-3">
        <label for="phone" class="form-label">Phone Number</label>
        <div class="input-group">
            <span class="input-group-text">+91</span>
            <input id="phone" type="tel" class="form-control" placeholder="1234567890" />
        </div>
        <button onclick="sendOtp()" class="btn btn-primary w-100 mt-3">Send OTP</button>
    </div>
    
    <div id="otpInputDiv" class="mb-3" style="display:none;">
        <label for="otp" class="form-label">Enter OTP</label>
        <input id="otp" type="text" class="form-control" placeholder="6-digit code" maxlength="6" />
        <button onclick="verifyOtp()" class="btn btn-success w-100 mt-3">Verify OTP</button>
    </div>
    
    <div id="message" class="mt-3 text-center small"></div>
</div>

<script>
    let currentPhone = "";
    
    function displayMessage(text, isError = false) {
        const messageDiv = document.getElementById("message");
        messageDiv.innerText = text;
        
        
        messageDiv.className = isError 
            ? "mt-3 text-center small text-danger fw-bold" 
            : "mt-3 text-center small text-success";
    }

    function sendOtp() {
        currentPhone = document.getElementById("phone").value;
        if (!currentPhone) {
            displayMessage("Please enter a phone number.", true);
            return;
        }
        
        displayMessage("Sending OTP...", false);
        
        fetch("/api/auth/send-otp", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({phoneNumber: currentPhone})
        })
        .then(res => {
            if (res.ok) {
                document.getElementById("phoneInputDiv").style.display = "none";
                document.getElementById("otpInputDiv").style.display = "";
                displayMessage("OTP sent to " + currentPhone + ". Check console for mock OTP.", false);
            } else {
                res.json().then(data => {
                    displayMessage(data.message || "Failed to send OTP.", true);
                }).catch(() => {
                    displayMessage("Failed to send OTP (server error).", true);
                });
            }
        });
    }
    
    function verifyOtp() {
        const otp = document.getElementById("otp").value;
        
        displayMessage("Verifying OTP...", false);
        
        fetch("/api/auth/verify-otp", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({phoneNumber: currentPhone, code: otp})
        })
        .then(res => {
            if (!res.ok) {
                
                return res.json().then(errData => Promise.reject(errData.message || 'Invalid OTP.'));
            }
            return res.json();
        })
        .then(data => {
            
            if (data.status === "approved" || data.redirectUrl) {
                const redirectUrl = data.redirectUrl || "/bookstore";
                displayMessage("Login Successful. Redirecting...", false);
                
                
                setTimeout(() => {
                     window.location.href = redirectUrl;
                }, 500); 
            } else {
                
                displayMessage(data.message || "Invalid OTP.", true);
            }
        })
        .catch(error => {
           
            console.error('Login error:', error);
            const errorMessage = typeof error === 'string' ? error : "An unexpected error occurred.";
            displayMessage(errorMessage, true);
        });
    }
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
